name: Telegram OIDC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/src/auth/telegram-oidc.ts"
      - "tools/scripts/check-telegram-oidc.mjs"
      - "tools/test/check-telegram-oidc.test.mjs"
      - ".github/workflows/telegram-oidc.yml"

permissions:
  contents: read

jobs:
  public-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tools/test/check-telegram-oidc.test.mjs
      - name: Verify public Telegram discovery and signing keys
        run: node tools/scripts/check-telegram-oidc.mjs
