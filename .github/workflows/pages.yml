name: Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/site-domain.yml"
      - "ops/site-domain.json"
      - "tools/scripts/connect-site-domain.mjs"
      - "tools/test/connect-site-domain.test.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.API_ORIGIN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
      - run: npm run build:pages -w @a-move-ago/client
        env:
          VITE_API_BASE_URL: ${{ vars.API_ORIGIN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist/pages
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the published page and its application bundle
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL || steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const location = new URL(process.env.WEB_APP_URL);
          if (location.protocol !== "https:" || location.username || location.password ||
              location.search || location.hash || !location.pathname.endsWith("/")) {
            throw new Error("Invalid published application URL");
          }
          const page = location.href;
          const expected = await readFile("apps/client/dist/pages/index.html", "utf8");
          let verified = false;
          for (let attempt = 0; attempt < 5; attempt += 1) {
            const response = await fetch(`${page}?release=${process.env.DEPLOYED_SHA}`, {
              redirect: "error", cache: "no-store", signal: AbortSignal.timeout(10_000),
            });
            if (response.ok && (await response.text()) === expected) {
              verified = true;
              break;
            }
            if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          if (!verified) throw new Error("Published page does not match this release");
          const source = expected.match(/<script[^>]+src="([^"]+\.js)"/u)?.[1];
          if (!source) throw new Error("Application script missing from page");
          const asset = new URL(source, page);
          if (asset.origin !== new URL(page).origin || !asset.pathname.startsWith(new URL("assets/", page).pathname)) {
            throw new Error("Unexpected application script location");
          }
          const bundle = await fetch(asset, {
            redirect: "error", cache: "no-store", signal: AbortSignal.timeout(10_000),
          });
          if (!bundle.ok || (await bundle.arrayBuffer()).byteLength === 0) {
            throw new Error("Published application script is unavailable");
          }
          console.log(JSON.stringify({ ok: true, page, release: process.env.DEPLOYED_SHA }));
          NODE
      - name: Install the production browser smoke-check runtime
        run: npx playwright install --with-deps chromium
      - name: Verify the live archive, historical dates and return to today
        env:
          WEB_APP_URL: ${{ vars.WEB_APP_URL || steps.deployment.outputs.page_url }}
        run: node tools/scripts/check-live-archive-ui.mjs
      - name: Verify English default, Russian and Chinese on the live site
        env:
          WEB_APP_URL: ${{ vars.WEB_APP_URL || steps.deployment.outputs.page_url }}
        run: node tools/scripts/check-live-locales-ui.mjs
