name: Private daily content

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/content.yml"
      - "ops/content-key-request.json"
      - "ops/content-envelope.json"
      - "tools/src/private-content.ts"
      - "tools/src/localization-import.ts"
  pull_request:
    paths:
      - ".github/workflows/content.yml"
      - "ops/content-key-request.json"
      - "ops/content-envelope.json"
      - "tools/src/private-content.ts"
      - "tools/src/localization-import.ts"
      - "tools/src/private-content.test.ts"
      - "tools/src/localization-import.test.ts"

permissions:
  contents: read

concurrency:
  group: content-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @a-move-ago/tools
      - run: npm test -w @a-move-ago/tools
  transfer:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Transfer original daily content without exposing solutions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run content:private -w @a-move-ago/tools
      - name: Verify every published historical day through the public API
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: node tools/scripts/check-archive-production.mjs
      - name: Verify every available localized day through the public API
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: node tools/scripts/check-localizations-production.mjs
      - name: Verify localized hints and solutions with an isolated synthetic guest
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node tools/scripts/check-localized-production-play.mjs
