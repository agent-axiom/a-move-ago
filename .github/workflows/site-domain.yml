name: Site domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-domain.yml"
      - "ops/site-domain.json"
      - "tools/scripts/connect-site-domain.mjs"
      - "tools/test/connect-site-domain.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/site-domain.yml"
      - "ops/site-domain.json"
      - "tools/scripts/connect-site-domain.mjs"
      - "tools/test/connect-site-domain.test.mjs"

permissions:
  contents: read

concurrency:
  group: site-domain
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tools/test/connect-site-domain.test.mjs
  configure:
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: request
        name: Validate the requested domain and connection phase
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from "node:fs/promises";
          const request = JSON.parse(await readFile("ops/site-domain.json", "utf8"));
          if (Object.keys(request).sort().join(",") !== "domain,phase" ||
              request.domain !== "chess.kosarevsky.dev" ||
              !["inspect", "connect", "check-https"].includes(request.phase)) {
            throw new Error("INVALID_SITE_DOMAIN_REQUEST");
          }
          await appendFile(process.env.GITHUB_OUTPUT, `phase=${request.phase}\n`);
          NODE
      - name: Inspect DNS and Pages access without changing settings
        if: steps.request.outputs.phase == 'inspect'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { resolveCname, resolveNs } from "node:dns/promises";
          const domain = "chess.kosarevsky.dev";
          const zoneName = "kosarevsky.dev";
          const repository = "agent-axiom/a-move-ago";
          async function get(url, token) {
            try {
              const response = await fetch(url, {
                headers: { authorization: `Bearer ${token}`, accept: "application/json" },
                redirect: "error", signal: AbortSignal.timeout(15_000),
              });
              const data = await response.json().catch(() => null);
              return { status: response.status, data };
            } catch { return { status: 0, data: null }; }
          }
          const summary = { domain, target: "agent-axiom.github.io" };
          summary.publicDns = {
            nameservers: await resolveNs(zoneName).catch(() => []),
            cnames: await resolveCname(domain).catch(() => []),
          };
          const pages = await get(`https://api.github.com/repos/${repository}/pages`, process.env.GH_TOKEN);
          summary.pages = { status: pages.status };
          if (pages.status === 200) {
            summary.pages = {
              status: pages.status, cname: pages.data?.cname ?? null,
              url: pages.data?.html_url, buildType: pages.data?.build_type,
              httpsEnforced: pages.data?.https_enforced,
              certificate: pages.data?.https_certificate?.state ?? null,
            };
          }
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const zones = await get(`https://api.cloudflare.com/client/v4/zones?name=${zoneName}&per_page=5`, token);
          summary.cloudflare = { zoneListStatus: zones.status, zoneFound: false };
          const matching = Array.isArray(zones.data?.result)
            ? zones.data.result.filter(zone => zone.name === zoneName && zone.account?.id === account && zone.status === "active")
            : [];
          if (zones.status === 200 && zones.data?.success === true && matching.length === 1) {
            const zone = matching[0];
            const records = await get(`https://api.cloudflare.com/client/v4/zones/${zone.id}/dns_records?name=${domain}&per_page=20`, token);
            summary.cloudflare = {
              zoneListStatus: zones.status, zoneFound: true, dnsReadStatus: records.status,
              records: records.data?.success === true && Array.isArray(records.data.result)
                ? records.data.result.filter(record => record.name === domain).map(record => ({
                    type: record.type, name: record.name, target: record.content,
                    proxied: record.proxied, ttl: record.ttl,
                  })) : [],
            };
          }
          console.log(JSON.stringify(summary));
          NODE
      - name: Connect the requested Pages domain or confirm HTTPS
        if: steps.request.outputs.phase != 'inspect'
        env:
          GH_TOKEN: ${{ github.token }}
          DOMAIN_PHASE: ${{ steps.request.outputs.phase }}
        run: |
          node --input-type=module <<'NODE'
          import { connectSiteDomain } from "./tools/scripts/connect-site-domain.mjs";
          try {
            const phase = process.env.DOMAIN_PHASE;
            let result;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              result = await connectSiteDomain({ token: process.env.GH_TOKEN, phase });
              if (result.status === "ready" || phase !== "connect") break;
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 10_000));
            }
            console.log(JSON.stringify(result));
          } catch (error) {
            console.error(JSON.stringify({ ok: false, code: error.message }));
            process.exitCode = 1;
          }
          NODE
