name: Production access diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/access.yml"
      - "tools/scripts/check-production-access.mjs"

permissions:
  contents: read

concurrency:
  group: production-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check D1 and Telegram access without changing production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node tools/scripts/check-production-access.mjs
