name: Telegram OIDC diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-oidc-diagnostics.yml"
      - "tools/scripts/check-oidc-provider-logs.mjs"

permissions:
  contents: read

concurrency:
  group: telegram-oidc-diagnostics
  cancel-in-progress: false

jobs:
  read-diagnostics:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test diagnostic sanitization
        run: node --test tools/test/check-oidc-provider-logs.test.mjs
      - name: Read sanitized Telegram failure diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/scripts/check-oidc-provider-logs.mjs
